<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>test: connector</title><link rel="stylesheet" href="../css/app.css"></head><body>
<header id="toolbar" class="toolbar"></header><aside id="parts" class="panel panel-left"></aside>
<main class="canvas-wrap"><div id="canvas" class="canvas"></div></main><aside id="props" class="panel panel-right"></aside><footer id="pagebar" class="pagebar"></footer>
<pre id="out"></pre>
<script type="module">
// テストは localStorage（自動保存）を消すので、公開サイトでは実行しない
if (!['localhost', '127.0.0.1'].includes(location.hostname)) { document.body.textContent = 'テストはローカル環境（localhost）でのみ実行できます。'; throw new Error('local only'); }
if (!new URLSearchParams(location.search).get('restore')) localStorage.clear();
const log=[]; const ok=(n,c)=>log.push((c?'PASS ':'FAIL ')+n);
window.addEventListener('error',e=>log.push('ERROR '+e.message));
try{
await import('../js/main.js');
const {canvas, store, cmd} = window.__app;
canvas.fit();
canvas.placePart('HRS-ZE064W-14DS', 100, 100);
const pg=()=>store.page; const c0=()=>pg().connectors[0];
ok('place', pg().connectors.length===1 && c0().label==='J1');
cmd.rotate(90); ok('rotate', c0().rotation===90);
cmd.undo(); ok('undo rotate', c0().rotation===0);
cmd.redo(); ok('redo rotate', c0().rotation===90);
cmd.copy(); cmd.paste(); ok('paste', pg().connectors.length===2 && pg().connectors[1].label==='J2' && pg().connectors[1].x===110);
cmd.deleteSelection(); ok('delete', pg().connectors.length===1);
// drag via pointer events on a pin
store.select(null);
const pin=document.querySelector('#canvas [data-kind=pin][data-pin="3"]'); const r=pin.getBoundingClientRect();
const svg=canvas.svg; const opt=(x,y)=>({bubbles:true,clientX:x,clientY:y,button:0,pointerId:1});
pin.dispatchEvent(new PointerEvent('pointerdown',opt(r.x+2,r.y+2)));
ok('pin select', store.ui.selection?.kind==='pin' && store.ui.selection.pinId==='3');
const z=canvas.zoom; svg.dispatchEvent(new PointerEvent('pointermove',opt(r.x+2+20*z,r.y+2+10*z)));
svg.dispatchEvent(new PointerEvent('pointerup',opt(r.x+2+20*z,r.y+2+10*z)));
ok('drag move '+c0().x+','+c0().y, c0().x===120 && c0().y===110);
cmd.undo(); ok('drag undo', c0().x===100 && c0().y===100);
// keyboard
window.dispatchEvent(new KeyboardEvent('keydown',{key:'Delete'}));
ok('pin row/prop panel', document.querySelectorAll('.pin-table tbody tr').length===14);
store.select({kind:'connector',id:c0().id});
window.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowRight',shiftKey:true}));
ok('nudge', c0().x===110);
window.dispatchEvent(new KeyboardEvent('keydown',{key:'Delete'}));
ok('key delete '+pg().connectors.length+' sel='+JSON.stringify(store.ui.selection), pg().connectors.length===0);
window.dispatchEvent(new KeyboardEvent('keydown',{key:'z',ctrlKey:true}));
ok('key undo', pg().connectors.length===1);
canvas.placePart('HRS-ZE064W-8DS', 50, 50); ok('8DS placeable', pg().connectors.length===2); cmd.undo();
}catch(e){log.push('EXC '+e.stack)}
document.getElementById('out').textContent=log.join('\n');
</script></body></html>
